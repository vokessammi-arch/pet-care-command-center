<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b7c67"><link rel="manifest" href="manifest.json"><title>Pet Care Command Center</title><style>:root{--a:#5b7c67;--bg:#f5f7f3;--card:#fff;--line:#dfe6e1;--muted:#718078}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26302a}.app{max-width:850px;margin:auto;padding:18px 16px 85px}h1{margin:0 0 4px}h2{font-size:21px}.muted{color:var(--muted)}button,input,select,textarea{font:inherit}button{border-radius:10px;padding:9px 12px;border:1px solid var(--line);background:white}.primary{background:var(--a);color:white;border:0;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pet{display:flex;gap:12px;align-items:center}.avatar{width:64px;height:64px;border-radius:50%;background:#e8f0eb;display:grid;place-items:center;font-size:31px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.screen{display:none}.screen.on{display:block}.title{display:flex;justify-content:space-between;align-items:center}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;color:var(--muted);margin:8px 0}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:4px}textarea{min-height:65px}.species{display:grid;grid-template-columns:1fr 1fr;gap:7px}.species button.sel{outline:2px solid var(--a);background:#e8f0eb}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:4}nav button{border:0;border-radius:0;font-size:11px;background:white;padding:10px 8px}@media(max-width:560px){.grid,.formgrid{grid-template-columns:1fr}}</style></head><body><div class="app"><h1>🐾 Pet Care Command Center</h1><div class="muted">Every animal. Every detail. One place.</div><main><section id="home" class="screen on"><div class="title"><h2>My Pets</h2><button class="primary" onclick="petForm()">+ Add pet</button></div><div id="pets" class="grid"></div><div class="card"><b>Household snapshot</b><div id="snap" class="muted"></div></div></section><section id="health" class="screen"><div class="title"><h2>🩺 Health</h2><button class="primary" onclick="healthForm()">+ Add</button></div><div id="healthList" class="card"></div></section><section id="care" class="screen"><div class="title"><h2>✨ Care</h2><button class="primary" onclick="careForm()">+ Add</button></div><div id="careList" class="card"></div></section><section id="money" class="screen"><div class="title"><h2>💰 Money</h2><button class="primary" onclick="expenseForm()">+ Add</button></div><div id="moneyList" class="card"></div></section><section id="emergency" class="screen"><div class="title"><h2>🚨 Emergency</h2><button onclick="shareAll()">Share all</button></div><div id="emList"></div></section><section id="more" class="screen"><h2>⚙️ More</h2><div class="card"><button onclick="backup()">Export backup</button> <label style="display:inline-block">Import<input type="file" accept="application/json" onchange="restore(event)" style="display:none"></label></div></section></main><nav><button onclick="show('home')">🏠<br>Home</button><button onclick="show('health')">🩺<br>Health</button><button onclick="show('care')">✨<br>Care</button><button onclick="show('money')">💰<br>Money</button><button onclick="show('emergency')">🚨<br>Emergency</button><button onclick="show('more')">⚙️<br>More</button></nav><div id="modal" class="modal"><div class="sheet"><button onclick="closeM()">×</button><div id="body"></div></div></div></div><script>const K='pcc-web-v4',old=localStorage.getItem('pcc-web-v3')||localStorage.getItem('pcc-web-v1');let d=JSON.parse(localStorage.getItem(K)||old||'null')||{pets:[],health:[],care:[],expenses:[],meds:[],weights:[]};for(let k of ['pets','health','care','expenses','meds','weights'])d[k]??=[];const $=x=>document.getElementById(x),v=x=>$(x)?.value||'',pn=id=>(d.pets.find(p=>p.id==id)||{}).name||'Unknown',save=()=>{try{localStorage.setItem(K,JSON.stringify(d));render()}catch(e){alert('Could not save. Try a smaller photo.')}},show=s=>{document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(s).classList.add('on')},open=h=>{$('body').innerHTML=h;$('modal').classList.add('on')},closeM=()=>{$('modal').classList.remove('on')};const S=[['Dog','🐕'],['Cat','🐈'],['Horse','🐴'],['Rabbit','🐇'],['Guinea pig','🐹'],['Hamster','🐹'],['Rat','🐀'],['Mouse','🐭'],['Hedgehog','🦔'],['Ferret','🦦'],['Chinchilla','🐿️'],['Parrot','🦜'],['Cockatiel','🦜'],['Finch','🐦'],['Canary','🐦'],['Duck','🦆'],['Chicken','🐔'],['Lizard','🦎'],['Gecko','🦎'],['Bearded dragon','🦎'],['Snake','🐍'],['Turtle','🐢'],['Tortoise','🐢'],['Frog','🐸'],['Newt','🦎'],['Salamander','🦎'],['Fish','🐠'],['Betta','🐠'],['Shrimp','🦐'],['Aquatic snail','🐌'],['Tarantula','🕷️'],['Scorpion','🦂'],['Insect','🪲'],['Land snail','🐌'],['Other','🐾']];let chosen='Dog';const icon=s=>(S.find(x=>x[0]==s)||['','🐾'])[1],group=s=>['Lizard','Gecko','Bearded dragon','Snake','Turtle','Tortoise'].includes(s)?'reptile':['Parrot','Cockatiel','Finch','Canary','Duck','Chicken'].includes(s)?'bird':s;const fields={Horse:['Barn / stall','Height','Feed / forage','Farrier','Dental'],Rabbit:['Hay / forage','Pellets','Dental care','Nail trim','Litter notes'],reptile:['Enclosure','Temperature','Humidity','Feeding','Shedding','Supplements'],bird:['Enclosure','Diet','Beak care','Nail care','Avian vet'],Dog:['Food / diet','Groomer','Exercise notes'],Cat:['Food / diet','Litter notes','Groomer'],default:['Diet / feeding','Habitat / enclosure','Care notes']};function petForm(id){let p=id?d.pets.find(x=>x.id==id):{};chosen=p.species||'Dog';open(`<h2>${id?'Edit':'Add'} pet</h2><div class="species">${S.map(x=>`<button class="${x[0]==chosen?'sel':''}" onclick="choose('${x[0]}',this)">${x[1]} ${x[0]}</button>`).join('')}</div><div class="formgrid"><label>Name<input id="name" value="${p.name||''}"></label><label>Breed / variety<input id="breed" value="${p.breed||''}"></label><label>Birthday<input id="birth" type="date" value="${p.birthday||''}"></label><label>Weight<input id="weight" value="${p.weight||''}"></label><label>Microchip / ID<input id="micro" value="${p.micro||''}"></label></div><h3>Care details</h3><div id="cf">${cf(p)}</div><h3>Vet & emergency</h3><div class="formgrid"><label>Vet / provider<input id="vet" value="${p.vet||''}"></label><label>Vet phone<input id="vetphone" value="${p.vetPhone||''}"></label><label>Emergency contact<input id="em" value="${p.emergency||''}"></label><label>Emergency phone<input id="emphone" value="${p.emergencyPhone||''}"></label></div><label>Allergies / sensitivities<textarea id="all">${p.allergies||''}</textarea></label><label>Important notes<textarea id="notes">${p.notes||''}</textarea></label><label>Pet photo<input id="photo" type="file" accept="image/*" onchange="photo(event)"></label><div class="avatar" id="prev">${p.photo?`<img src="${p.photo}">`:icon(chosen)}</div><button class="primary" style="width:100%;margin-top:12px" onclick="savePet(${id||0})">Save pet</button>`)}function cf(p){return(fields[group(chosen)]||fields.default).map((f,i)=>`<label>${f}<input id="c${i}" value="${p.care?.[i]||''}"></label>`).join('')}function choose(s,b){chosen=s;document.querySelectorAll('.species button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('cf').innerHTML=cf({})}function photo(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('prev').innerHTML=`<img src="${r.result}">`;window.newPhoto=r.result};r.readAsDataURL(f)}function savePet(id){let p=id?d.pets.find(x=>x.id==id):{id:Date.now()},fs=fields[group(chosen)]||fields.default;p.name=v('name').trim()||'Unnamed pet';p.species=chosen;p.breed=v('breed');p.birthday=v('birth');p.weight=v('weight');p.micro=v('micro');p.care=fs.map((_,i)=>v('c'+i));p.vet=v('vet');p.vetPhone=v('vetphone');p.emergency=v('em');p.emergencyPhone=v('emphone');p.allergies=v('all');p.notes=v('notes');if(window.newPhoto){p.photo=window.newPhoto;window.newPhoto=null}if(!id)d.pets.push(p);save();closeM()}function profile(id){let p=d.pets.find(x=>x.id==id),fs=fields[group(p.species)]||fields.default;open(`<h2>${icon(p.species)} ${p.name}</h2><div class="pet"><div class="avatar">${p.photo?`<img src="${p.photo}">`:icon(p.species)}</div><div>${p.species}<br><span class="muted">${p.breed||''}</span></div></div><div class="card"><b>Care profile</b>${fs.map((f,i)=>`<div>${f}: <b>${p.care?.[i]||'Not entered'}</b></div>`).join('')}</div><div class="card"><b>Emergency</b><p>Vet: ${p.vet||'—'} ${p.vetPhone||''}</p><p>Emergency: ${p.emergency||'—'} ${p.emergencyPhone||''}</p><p>Allergies: ${p.allergies||'None listed'}</p><p>ID: ${p.micro||'—'}</p></div><button onclick="petForm(${id})">Edit</button> <button class="primary" onclick="weightForm(${id})">+ Weight</button> <button onclick="medForm(${id})">+ Medication</button> <button onclick="delPet(${id})">Delete</button>`)}function delPet(id){if(confirm('Delete this pet and its records?')){d.pets=d.pets.filter(p=>p.id!=id);['health','care','expenses','meds','weights'].forEach(k=>d[k]=d[k].filter(x=>x.pet!=id));save();closeM()}}function weightForm(id){open(`<h2>Add weight</h2><label>Weight<input id="ww"></label><label>Date<input id="wd" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="primary" onclick="d.weights.push({id:Date.now(),pet:${id},weight:v('ww'),date:v('wd')});save();closeM();profile(${id})">Save</button>`)}function medForm(id){open(`<h2>Add medication</h2><label>Name<input id="mn"></label><label>Dose<input id="md"></label><label>Schedule<input id="ms"></label><button class="primary" onclick="d.meds.push({id:Date.now(),pet:${id},name:v('mn'),dose:v('md'),schedule:v('ms')});save();closeM();profile(${id})">Save</button>`)}function healthForm(){open(`<h2>Add health record</h2><label>Pet<select id="hp">${d.pets.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label>Type<select id="ht"><option>Vaccination</option><option>Vet visit</option><option>Medication</option><option>Dental</option><option>Other</option></select></label><label>Date<input id="hd" type="date"></label><label>Notes<textarea id="hn"></textarea></label><button class="primary" onclick="d.health.push({id:Date.now(),pet:+v('hp'),type:v('ht'),date:v('hd'),notes:v('hn')});save();closeM()">Save</button>`)}function careForm(){open(`<h2>Add care task</h2><label>Pet<select id="cp">${d.pets.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label>Task<input id="ct"></label><label>Due date<input id="cd" type="date"></label><label>Repeat<select id="cr"><option>None</option><option>Daily</option><option>Weekly</option><option>Monthly</option><option>Yearly</option></select></label><button class="primary" onclick="d.care.push({id:Date.now(),pet:+v('cp'),task:v('ct'),date:v('cd'),repeat:v('cr'),done:false});save();closeM()">Save</button>`)}function expenseForm(){open(`<h2>Add expense</h2><label>Pet<select id="xp"><option value="0">Household</option>${d.pets.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label>Amount<input id="xa" type="number" step=".01"></label><label>Category<input id="xc"></label><label>Date<input id="xd" type="date"></label><button class="primary" onclick="d.expenses.push({id:Date.now(),pet:+v('xp'),amount:+v('xa'),category:v('xc'),date:v('xd')});save();closeM()">Save</button>`)}function render(){ $('pets').innerHTML=d.pets.map(p=>`<div class="card pet" onclick="profile(${p.id})"><div class="avatar">${p.photo?`<img src="${p.photo}">`:icon(p.species)}</div><div><b>${p.name}</b><br><span class="muted">${p.species} · ${p.breed||''}</span></div></div>`).join('')||'<div class="card">Add your first animal. 🐾</div>';$('snap').textContent=`${d.pets.length} pets · ${d.health.length} health records · ${d.care.filter(x=>!x.done).length} open care tasks`;$('healthList').innerHTML=d.health.map(x=>`<div>${pn(x.pet)} · ${x.type} · ${x.date||''}<br><span class="muted">${x.notes||''}</span></div>`).join('<hr>')||'No health records yet.';$('careList').innerHTML=d.care.map(x=>`<div><b>${x.task}</b> · ${pn(x.pet)} · ${x.date||''} <button onclick="x.done=!x.done;save()">${x.done?'✓':'Done'}</button></div>`).join('<hr>')||'No care tasks yet.';$('moneyList').innerHTML=d.expenses.map(x=>`<div>${x.category||'Expense'} · $${Number(x.amount).toFixed(2)} · ${x.pet?pn(x.pet):'Household'}</div>`).join('<hr>')||'No expenses yet.';$('emList').innerHTML=d.pets.map(p=>`<div class="card emergency"><div class="pet"><div class="avatar">${p.photo?`<img src="${p.photo}">`:icon(p.species)}</div><b>${p.name}</b></div><p>Vet: ${p.vet||'—'} ${p.vetPhone||''}</p><p>Emergency: ${p.emergency||'—'} ${p.emergencyPhone||''}</p><p>Allergies: ${p.allergies||'None listed'}</p></div>`).join('')||'No pets yet.'}function shareAll(){let t=d.pets.map(p=>`${p.name} (${p.species})\nVet: ${p.vet||'—'} ${p.vetPhone||''}\nEmergency: ${p.emergency||'—'} ${p.emergencyPhone||''}\nAllergies: ${p.allergies||'None listed'}`).join('\n\n');navigator.share?navigator.share({title:'Pet emergency profiles',text:t}):navigator.clipboard?.writeText(t)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='pet-care-backup.json';a.click()}function restore(e){let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();alert('Restored!')}catch{alert('Could not read backup.')}};r.readAsText(e.target.files[0])}render();</script></body></html>
